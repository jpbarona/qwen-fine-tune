# Full training config for one arm. Five epochs over the 714 train questions,
# one prompt group of 8 generations per step. The step budget is computed by
# the CLI as [training] epochs times the train size, so no step count appears
# here. Checkpoints every 50 steps, checkpoint evaluation every 100 steps.

[model]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"

[judge]
provider = "openrouter"
model = "deepseek/deepseek-v4.1-flash-1017"
base_url = "https://openrouter.ai/api/v1/chat/completions"
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.0
concurrency = 32
max_attempts = 4
timeout_seconds = 60
cache_dir = "judge-cache"

[data]
name = "mbpp"
dataset = "data/mbpp_full.jsonl"
split_seed = 1234
train_size = 714
test_size = 250

[training]
method = "grpo"
generations_per_prompt = 8
temperature = 0.9
learning_rate = 1e-5
epochs = 5
lora_rank = 32
lora_alpha = 64
max_prompt_tokens = 512
max_completion_tokens = 2048
# Measure entropy every N training steps. Zero disables it.
entropy_every_steps = 500
clip_epsilon = 0.2
kl_beta = 0.0
# Steps start at two prompts and grow while free memory stays at or above this
# floor and at or above one prompt group's measured footprint, in MiB. The
# largest size that fit is kept. Never below one prompt.
memory_floor_mib = 512
seed = 0

[run]
checkpoint_every_steps = 50
eval_every_steps = 100
eval_questions = 100
eval_subset_seed = 2026
