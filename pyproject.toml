[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr"
version = "0.1.0"
description = "Small-model code RLVR reward study"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

# The one runtime environment. vLLM samples every rollout and the same process
# keeps the Hugging Face model for the optimizer. Pinned exact versions for a
# CUDA 12, Python 3.12 host. LFM LoRA needs vLLM 0.17 or newer.
vllm = [
    "vllm==0.34.0",
    "torch==2.14.0",
    "transformers==5.22.2",
    "peft==0.18.1",
    "accelerate==1.8.1",
]

[project.scripts]
rlvr = "rlvr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlvr = ["resources/*.toml", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
