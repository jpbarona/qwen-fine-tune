[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr"
version = "0.1.0"
description = "Small-model code RLVR reward study"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rlvr = "rlvr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlvr = ["resources/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
