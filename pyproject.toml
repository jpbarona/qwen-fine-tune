[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr"
version = "0.1.0"
description = "Small-model code RLVR reward study"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The real training path. Pinned exact versions for a CUDA 12, Python 3.12
# host. Install torch from the cu124 index first, then this extra. Versions
# chosen to satisfy Qwen3 (transformers >= 4.51) and PEFT on a 3090.
train = [
    "torch==2.7.1",
    "transformers==4.57.1",
    "peft==0.17.1",
    "accelerate==1.8.1",
    "safetensors==0.5.3",
]

[project.scripts]
rlvr = "rlvr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlvr = ["resources/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
