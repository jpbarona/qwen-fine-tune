name: Checks

# Manual only. Run it from the Actions tab or with:
#   ~/.local/bin/gh workflow run Checks
# Automatic runs on push and pull request are off on purpose: a full run costs
# about eight minutes of paid minutes, and the owner starts it when wanted.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev,tracking]'
      - run: .venv/bin/lint-imports
      - run: .venv/bin/python -m pytest -q
